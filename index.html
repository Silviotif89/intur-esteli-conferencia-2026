<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#242466"><meta name="description" content="Conferencia INTUR: diseño y desarrollo de productos turísticos innovadores y sostenibles. 49 diapositivas, QR cada siete y preguntas mediante Firebase."><title>INTUR Nicaragua | Turismo que transforma territorios</title><link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="assets/conference.css"></head><body>
<div id="viewport"><div id="stage" aria-live="off"></div></div>
<div id="presentationTools" class="presentationTools" aria-label="Controles del expositor">
  <div class="timeModule" aria-label="Cronómetro de la conferencia">
    <span class="timeCaption">TIEMPO DE EXPOSICIÓN</span>
    <div class="timeMain"><output id="elapsedTime" aria-live="off">00:00</output><span id="timeState" class="timeState">Listo</span></div>
    <div class="timeActions"><button id="timePrimary" type="button">Iniciar tiempo</button><button id="timeReset" type="button" hidden>Reiniciar</button></div>
    <div id="timeConfirm" class="timeConfirm" hidden><span>¿Reiniciar el tiempo?</span><button id="timeConfirmYes" type="button">Sí</button><button id="timeConfirmNo" type="button">No</button></div>
  </div>
  <button id="presentToggle" class="presentToggle" type="button" aria-pressed="false"><span aria-hidden="true">⛶</span> PRESENTAR</button>
</div>
<button id="qaBell" class="qaBell" type="button" aria-label="Abrir panel privado de preguntas" aria-haspopup="dialog" aria-controls="qaOverlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="bellLabel">Preguntas</span><span id="qaBadge" class="qaBadge" aria-live="polite">—</span></button>
<div id="noteOverlay" class="noteOverlay"><div class="panel"><h2>Notas del facilitador</h2><p id="noteText"></p><button data-act="close">Cerrar · Esc</button></div></div>
<div id="indexOverlay" class="indexOverlay"><div class="panel" style="max-width:1180px"><h2>Índice de la conferencia</h2><p>Seleccioná la diapositiva a la que querés ir.</p><div id="indexButtons" class="indexes"></div><p><button data-act="close">Cerrar · Esc</button></p></div></div>
<div id="qaOverlay" class="qaOverlay" role="dialog" aria-modal="true" aria-labelledby="qaTitle" aria-hidden="true"><section class="presenterQaPanel"><header class="presenterQaHead"><div><span class="presenterKicker">INTUR · PANEL DEL EXPOSITOR</span><h2 id="qaTitle">Preguntas en directo</h2><p id="qaConnection">Iniciá sesión para consultar las preguntas privadas.</p></div><div class="presenterHeadActions"><button id="qaLogout" type="button" class="qaSecondary hidden">Cerrar sesión</button><button id="qaClose" type="button" class="qaClose">Volver a la presentación <span aria-hidden="true">×</span></button></div></header><div id="qaLoginBox" class="qaLoginBox"><form id="qaLogin" autocomplete="on"><label for="qaEmail">Correo del moderador</label><input id="qaEmail" type="email" autocomplete="username" required><label for="qaPassword">Contraseña</label><input id="qaPassword" type="password" autocomplete="current-password" required><button class="qaPrimary" type="submit">Entrar y ver preguntas</button><div id="qaLoginStatus" class="qaMessage" role="status" aria-live="polite"></div></form></div><section id="qaInbox" class="qaInbox hidden" aria-label="Bandeja de preguntas"><div class="qaSummary"><strong><span id="qaPendingCount">0</span> pendientes</strong><span id="qaArrivalStatus">En espera de preguntas nuevas</span></div><div id="qaQuestionList" class="qaQuestionList"></div></section><div id="qaStatus" class="qaStatus" role="status" aria-live="polite"></div></section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/config.js"></script><script src="assets/data.js"></script><script src="assets/qrcode-local.js"></script><script src="assets/presentation-tools.js"></script><script src="assets/slide.js"></script>
<script type="module" src="assets/presenter-qa.js"></script>
</body></html>
